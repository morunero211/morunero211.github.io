<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>조이산업 - 실적현황</title>
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
  <link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="../images/joy-log-color.png" rel="icon" type="image/png"/>
  <link href="../components/common.css" rel="stylesheet"/>
  <link href="records.css" rel="stylesheet">
</head>
<body id="top">

  <div class="page-hero">
    <div class="page-hero-bg-text">Records</div>
    <div class="page-hero-content"><h1>실적현황</h1></div>
  </div>

  <section class="records-section">
    <div class="container">
      <div class="records-header">
        <h3 class="records-title"><i class="fas fa-building"></i> 기업별 사업실적</h3>
        <div class="filter-box">
          <label for="company-filter" class="filter-label">기업 선택:</label>
          <select id="company-filter" class="company-select">
            <option value="">전체 기업</option>
          </select>
        </div>
      </div>

      <div class="records-display" id="records-display">
        <!-- JavaScript로 동적 렌더링 -->
      </div>
    </div>
  </section>

  <div id="partners"></div>


  <script src="../components/common.js"></script>
  <script src="./records.js"></script>
</body>
</html>
